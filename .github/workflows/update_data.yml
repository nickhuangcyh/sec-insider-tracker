name: Update Insider Trading Data

on:
  schedule:
    # Run daily at 11:00 UTC (ET ~7AM, after all filings including late ones are public)
    - cron: '0 11 * * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Fetch Insider Data
        run: python scripts/fetch_insider_data.py

      - name: Commit data changes to main
        run: |
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update insider trading data: $(date +%Y-%m-%d)" && git push origin main)

      - name: Merge main into release and push
        run: |
          git checkout release
          git merge main --no-edit
          git push origin release
