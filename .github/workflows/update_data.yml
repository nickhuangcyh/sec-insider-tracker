name: Update Insider Trading Data

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed for committing and pushing changes

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0 # 取得完整歷史以進行合併與推送

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Fetch Insider Data
        run: python scripts/fetch_insider_data.py

      - name: Commit and Push to main
        run: |
          git add data/
          git status
          # 檢查是否有新資料，有的話就 commit 並 push 到 main
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update insider trading data: $(date +%Y-%m-%d)" && git push origin main)

      - name: Merge main into release and push
        run: |
          # 切換到 release 並合併 main
          git checkout release
          git merge main --no-edit
          git push origin release
